name: daily-news

on:
  schedule:
    # UTC 0:15 = 北京 8:15 早间主生成（推送微信）
    - cron: '15 0 * * *'
    # UTC 4:00/8:00/12:00 = 北京 12:00/16:00/20:00 刷新（不推送，仅更新图片与缓存）
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      push:
        description: '推送模式'
        type: choice
        default: 'auto'
        options: ['auto', 'always']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install pillow feedparser requests beautifulsoup4

      - name: 生成今日新闻图
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python generate_news.py --push "${{ github.event.inputs.push || 'auto' }}"

      - name: 提交产物
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "daily: $(date -u +%F) 新闻图" || echo "nothing to commit"
          git push
